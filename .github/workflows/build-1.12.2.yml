name: Build Forge 1.12.2
on:
  push:
    branches: ['1.12.2']
  pull_request:
    branches: ['1.12.2']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build the Forge 1.12.2 jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: immersive-paintings-forge-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
